name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # The `live` marker drives a real browser against 1337x. Running it here
      # would be slow, flaky, and would point CI traffic at a third party, so it
      # stays a local pre-release check.
      - name: Unit tests
        run: uv run pytest -m 'not live' -q
