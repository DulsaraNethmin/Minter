name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

env:
  REGISTRY: ghcr.io
# IMAGE is not set here: github.repository_owner preserves the account's casing
# ("DulsaraNethmin"), and container refs must be lowercase. Each job derives it in
# a step instead, so forks with any casing work too. metadata-action lowercases
# `images:` on its own, but the raw `outputs:` string below does not.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag whose version disagrees with the declared one is invisible until someone
  # reports the wrong number in /health, so fail the release instead.
  # The job always runs and the step is conditional, rather than gating the whole
  # job on `if:`. A job that `needs` a *skipped* job is itself skipped, so gating
  # the job would stop non-tag pushes building at all.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          init=$(grep -m1 '__version__' src/minter/__init__.py | cut -d'"' -f2)
          echo "tag=$tag  pyproject=$declared  __init__=$init"
          if [ "$tag" != "$declared" ] || [ "$tag" != "$init" ]; then
            echo "::error::version mismatch — bump pyproject.toml and src/minter/__init__.py to $tag"
            exit 1
          fi

  # Each architecture builds on its own native runner and pushes by digest.
  # Under QEMU this image — a 230 MB Firefox extraction plus apt — takes 30-60
  # minutes per arch; natively it is a few minutes, and the two run in parallel.
  build:
    needs: [version-check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (refs must be lowercase)
        run: echo "IMAGE=$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")/minter" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without this the image inherits org.opencontainers.image.version="24.04"
      # from the Ubuntu base, which reads as if the image itself were version 24.04.
      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # push is set inside `outputs`; setting it here too conflicts.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Scoped per-arch so the two jobs do not evict each other. The 10 GB
          # per-repo cache limit means a ~2.2 GB image will be evicted
          # periodically — an occasional cold build is expected, not a fault.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # Filename is the bare hash; the merge step re-adds the sha256: prefix.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Assemble both digests into one manifest list so `docker pull` resolves the
  # right architecture automatically.
  merge:
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name (refs must be lowercase)
        run: echo "IMAGE=$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")/minter" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
